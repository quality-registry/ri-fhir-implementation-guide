<style type="text/css">
  :root {
    --resq-ink: #172033;
    --resq-muted: #526070;
    --resq-line: #d9e2ec;
    --resq-surface: #f7fafc;
    --resq-accent: #0f766e;
    --resq-accent-dark: #115e59;
    --resq-link: #0b5cad;
  }

  body {
    color: var(--resq-ink);
  }

  a {
    color: var(--resq-link);
  }

  .navbar,
  .navbar-inverse {
    border-radius: 0;
  }

  .navbar .dropdown-menu > li > a {
    min-height: 34px;
    padding: 8px 18px;
    white-space: nowrap;
  }

  .navbar .dropdown-menu > li:empty,
  .navbar .dropdown-menu > li > a:empty {
    display: none;
  }

  #segment-content h1 {
    margin-top: 18px;
    margin-bottom: 18px;
  }

  #segment-content h2 {
    margin-top: 30px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--resq-line);
  }

  #segment-content table {
    width: 100%;
  }

  #segment-content table th {
    background: var(--resq-surface);
    color: var(--resq-ink);
  }

  #segment-content table td,
  #segment-content table th {
    vertical-align: top;
  }

  .resq-hero {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.85fr);
    gap: 24px;
    align-items: stretch;
    margin: 14px 0 28px;
    padding: 28px;
    border: 1px solid var(--resq-line);
    border-radius: 8px;
    background: linear-gradient(135deg, #f8fbfd 0%, #edf7f5 100%);
  }

  .resq-hero h2 {
    margin: 0 0 12px !important;
    padding: 0 !important;
    border: 0 !important;
    font-size: 30px;
    line-height: 1.2;
  }

  .resq-hero p {
    max-width: 760px;
    color: var(--resq-muted);
    font-size: 16px;
  }

  .resq-kicker {
    margin: 0 0 8px;
    color: var(--resq-accent-dark) !important;
    font-size: 13px !important;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  .resq-stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .resq-stat {
    display: flex;
    min-height: 92px;
    flex-direction: column;
    justify-content: center;
    padding: 16px;
    border: 1px solid var(--resq-line);
    border-radius: 8px;
    background: #ffffff;
    text-decoration: none;
  }

  .resq-stat:hover,
  .resq-card:hover {
    border-color: var(--resq-accent);
    text-decoration: none;
  }

  .resq-stat strong {
    color: var(--resq-accent-dark);
    font-size: 28px;
    line-height: 1;
  }

  .resq-stat span {
    margin-top: 8px;
    color: var(--resq-muted);
  }

  .resq-card-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0 28px;
  }

  .resq-card {
    display: block;
    min-height: 130px;
    padding: 18px;
    border: 1px solid var(--resq-line);
    border-radius: 8px;
    background: #ffffff;
    text-decoration: none;
  }

  .resq-card strong {
    display: block;
    margin-bottom: 8px;
    color: var(--resq-ink);
    font-size: 16px;
  }

  .resq-card span {
    color: var(--resq-muted);
  }

  @media (max-width: 900px) {
    .resq-hero,
    .resq-card-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 520px) {
    .resq-hero {
      padding: 18px;
    }

    .resq-stat-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
