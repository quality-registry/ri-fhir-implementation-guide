id: RESQFHIRIG
canonical: http://qualityregistry.org
name: RESQStrokeIG
title: RESQ Stroke Registry Implementation Guide
status: draft
version: 1.0.0
fhirVersion: 5.0.0
copyrightYear: 2026
releaseLabel: ci-build
publisher:
  name: Tecnomod / Universidad de Murcia
  url: http://qualityregistry.org
jurisdiction: urn:iso:std:iso:3166#ES "Spain"
dependencies:
  hl7.fhir.uv.extensions.r5: 5.2.0
parameters:
  path-resource:
    - input/resources
  path-pages:
    - input/pagecontent
  # This guide is written in English. Without this, the publisher infers a display
  # language from jurisdiction (ES) and validates every LOINC/SNOMED display against
  # Spanish designations, reporting correct English displays as errors.
  i18n-default-lang: en
menu:
  Home: index.html
  Guide:
    Resource Map: resource-map.html
    Modeling Decisions: modeling.html
  Resources:
    Profiles: profiles.html
    Extensions: extensions.html
    Terminology: terminology.html
  Artifacts: artifacts.html
  Downloads: downloads.html
