id: RESQFHIRIG
canonical: http://fhir.qualityregistry.org
name: RESQStrokeIG
title: RESQ Stroke Registry Implementation Guide
status: draft
version: 1.0.0
fhirVersion: 5.0.0
copyrightYear: 2026
releaseLabel: ci-build
publisher:
  name: "Health Management Institute z.ú"
  url: http://qualityregistry.org
# jurisdiction = urn:iso:std:iso:3166#EU "European Union"
jurisdiction: urn:iso:std:iso:3166#CZ "Czechia"
dependencies:
  hl7.fhir.uv.extensions.r5:
    version: 5.3.0
    uri: http://hl7.org/fhir/extensions/ImplementationGuide/hl7.fhir.uv.extensions
parameters:
  path-resource:
    - input/resources
  path-pages:
    - input/pagecontent
  # This guide is written in English. Without this, the publisher infers a display
  # language from the jurisdiction and validates every LOINC/SNOMED display against
  # that language's designations, reporting correct English displays as errors.
  i18n-default-lang: en
menu:
  Home: index.html
  Guide:
    Resource Map: resource-map.html
    Modeling Decisions: modeling.html
  Resources:
    Profiles: profiles.html
    Extensions: extensions.html
    Terminology: terminology.html
  Artifacts: artifacts.html
  Downloads: downloads.html
