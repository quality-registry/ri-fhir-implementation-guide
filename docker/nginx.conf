# Serves the generated IG site.
#
# Every path nginx would normally write to is redirected to /tmp or to
# stdout/stderr, so the container needs no writable filesystem:
#
#   docker run --read-only --tmpfs /tmp -p 8080:8080 <image>

worker_processes auto;
pid        /tmp/nginx.pid;          # the default /var/run/nginx.pid is not writable
error_log  /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formats the IG publishes that the stock mime.types does not define.
    types {
        text/turtle       ttl;
        application/xml   sch;
        application/gzip  tgz;
    }

    # Without these, nginx falls back to /var/cache/nginx.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/json application/xml
                    application/javascript text/javascript image/svg+xml text/turtle;

    server {
        listen      8080;            # above 1024, so no CAP_NET_BIND_SERVICE is needed
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
