name: Build and publish RES-Q FHIR IG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build IG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Compile FSH with SUSHI
        run: npx fsh-sushi . --log-level info

      - name: Download IG Publisher
        run: |
          curl -L -o publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll

      - name: Run IG Publisher
        run: java -jar publisher.jar \
            -ig fsh-generated/resources/ImplementationGuide-RES-Q-FHIR-IG.json \
            -fhirver 5.0.0 \
            -tx https://tx.fhir.org \
            -no-sushi

      - name: Prepare Pages output
        run: |
          test -f output/index.html
          touch output/.nojekyll
          if [ -f CNAME ]; then cp CNAME output/CNAME; fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-html
          path: output/qa.html
          if-no-files-found: ignore

      - name: Upload IG package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-package
          path: output/package.tgz
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
