name: Build and push a Docker container to an Azure Container Registry

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "ri-fhir-implementation-guide"
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Connect to Azure Container Registry (ACR)
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.AZURE_CONTAINER_REGISTRY_CLIENT_ID }}
          password: ${{ secrets.AZURE_CONTAINER_REGISTRY_CLIENT_SECRET }}

      # Container build and push to Azure Container Registry (ACR).
      # Stage 1 of the Dockerfile compiles the FSH and runs the IG Publisher,
      # so this step takes several minutes.
      - run: |
          docker build \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/${{ env.APP_NAME }}:${{ github.sha }} \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/${{ env.APP_NAME }}:${{ github.ref_name }} \
            .
          docker push --all-tags ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/${{ env.APP_NAME }}
