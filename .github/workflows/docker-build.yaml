name: Build and push a Docker container to GitHub Container Registry

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_NAME: "fhir-implementation-guide"
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Connect to GitHub Container Registry (GHCR)
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Container build and push to GitHub Container Registry (GHCR).
      # Stage 1 of the Dockerfile compiles the FSH and runs the IG Publisher,
      # so this step takes several minutes.
      - run: |
          IMAGE=${{ env.REGISTRY }}/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${{ env.APP_NAME }}
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t $IMAGE:${{ github.sha }} \
            .
          docker push --all-tags $IMAGE
