name: Build and push a Docker container to GitHub Container Registry

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_NAME: "fhir-implementation-guide"
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Connect to GitHub Container Registry (GHCR)
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Container build and push to GitHub Container Registry (GHCR).
      # Stage 1 of the Dockerfile compiles the FSH and runs the IG Publisher,
      # so this step takes several minutes.
      - run: |
          IMAGE=${{ env.REGISTRY }}/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${{ env.APP_NAME }}
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t $IMAGE:${{ github.sha }} \
            .
          docker push --all-tags $IMAGE
  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Update Config Repo and Trigger Deployment
        env:
          GH_TOKEN: ${{ secrets.PUSH_EVENT_TO_DEPLOYMENT_PAT }}

          CONFIG_REPO: "quality-registry/deployment"
          ENV_NAME: "ri-dev"
          VAR_NAME: "FHIR_IG_TAG"
          WORKFLOW_FILE: "ri-fhir-ig-cd.yaml"
        run: |
          echo "Updating variable $VAR_NAME in environment $ENV_NAME"
          gh variable set "$VAR_NAME" \
            --env "$ENV_NAME" \
            --body "${{ github.sha }}" \
            --repo "$CONFIG_REPO"

          echo "Triggering deployment workflow..."
          gh workflow run "$WORKFLOW_FILE" \
            --ref master \
            --repo "$CONFIG_REPO"

          echo "Deployment triggered successfully!"
